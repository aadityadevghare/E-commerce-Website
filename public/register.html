<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — AURA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="brand-logo">AURA<span class="dot">.</span></a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="shop.html" class="nav-link">Shop</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <div class="auth-container">
      <div class="auth-header">
        <h1>Create Account</h1>
        <p class="text-muted text-small">Join AURA for seamless ordering and tracking.</p>
      </div>

      <div id="auth-error" class="text-error text-small text-center" style="display: none; margin-bottom: 1rem; padding: 0.5rem; background: #fee2e2; border-radius: 6px;"></div>

      <form id="register-form">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" required placeholder="Enter full name">
        </div>

        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" required placeholder="name@domain.com">
        </div>

        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" required placeholder="At least 6 characters" minlength="6">
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="reg-confirm-password">Confirm Password</label>
          <input type="password" id="reg-confirm-password" required placeholder="Re-enter password" minlength="6">
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-full" style="margin-bottom: 1.5rem;">
          Create Account
        </button>
      </form>

      <div class="text-center text-small text-muted">
        Already have an account? <a href="login.html" class="text-bold" style="color: var(--color-action);">Sign in</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding-top: 0;">
        <div>© 2026 AURA Inc. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
