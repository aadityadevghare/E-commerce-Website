<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AURA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="brand-logo">AURA<span class="dot">.</span></a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="shop.html" class="nav-link">Shop</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <div class="auth-container">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p class="text-muted text-small">Sign in to access your orders and account.</p>
      </div>

      <div id="auth-error" class="text-error text-small text-center" style="display: none; margin-bottom: 1rem; padding: 0.5rem; background: #fee2e2; border-radius: 6px;"></div>

      <form id="login-form">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" required placeholder="name@domain.com">
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-full" style="margin-bottom: 1.5rem;">
          Sign In
        </button>
      </form>

      <!-- Quick Demo Login Helper -->
      <div style="background: #f1f5f9; padding: 1rem; border-radius: 8px; text-align: center; margin-bottom: 1.5rem; font-size: 0.85rem;">
        <span class="text-bold">Testing as Evaluator / Demo User?</span><br>
        <button type="button" class="btn btn-outline btn-sm" style="margin-top: 0.5rem; width: 100%;" onclick="fillDemoAccount()">
          ⚡ Auto-fill Demo Account (demo@aura.com)
        </button>
      </div>

      <div class="text-center text-small text-muted">
        Don't have an account? <a href="register.html" class="text-bold" style="color: var(--color-action);">Register now</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding-top: 0;">
        <div>© 2026 AURA Inc. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
